name: Deploy to Cloudflare Workers

# The site moved off GitHub Pages because the back office at /admin needs a
# server runtime. Every public page is still prerendered; only /admin/* runs
# on demand.
#
# ⚠️ THERE IS DELIBERATELY NO `schedule:` TRIGGER, and it must not come back
# into this file.
#
# GitHub's documented policy: "In a public repository, scheduled workflows are
# automatically disabled when no repository activity has occurred in 60 days."
# Only pushes reset that clock — the cron's own runs do not, which is the point
# of the rule. This repo is public and, by the project's own timeline, 60 quiet
# days is the *expected* state: the client is fully booked mid-June to August
# and visibility is suspended in August.
#
# The trap is that all three triggers live in ONE workflow file, so when GitHub
# disables it for inactivity it disables `push` and `workflow_dispatch` too.
# That is the back office's publish path: Francesco taps Pubblica, stage 5
# commits the article, and no build ever runs. The article silently never
# appears, and the one person who could diagnose it gets an email he is not
# expecting at an address the failure has nothing to do with.
#
# Nothing is lost by dropping the cron. It refreshed the Instagram tiles after
# Behold's daily sync, and Behold is not activated (no BEHOLD_FEED_ID), so today
# it is a no-op. Once it is live the tiles refresh on the next publish or on a
# manual "Run workflow". If a daily refresh is ever genuinely wanted, put the
# `schedule:` in its OWN workflow file so its auto-disabling cannot take the
# deploy path down with it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Unlike the Pages workflow this does NOT
# cancel-in-progress: a run started by the back office is publishing a real
# article, and cancelling it half-way would leave Francesco watching a publish
# that never lands.
concurrency:
  group: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Astro's image cache. Without this every run re-encodes all 545 AVIF/WebP/JPEG
      # derivatives from scratch — most of the build time Francesco waits through
      # after tapping Pubblica. Keyed on the photo pool plus the sharp version, since
      # either changing invalidates the encodings; falls back to the newest partial
      # cache so adding one photo reuses the other 545.
      - name: Restore Astro asset cache
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-assets-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-assets-

      # Bakes the latest Instagram posts into src/assets/ before Astro builds.
      # The script never fails the build — a down/absent feed falls back to the
      # curated strip.
      - name: Fetch Instagram feed
        run: node scripts/fetch-instagram.mjs
        env:
          BEHOLD_FEED_ID: ${{ secrets.BEHOLD_FEED_ID }}

      # `npm run build` is `astro check && astro build`, so a type error or a
      # missing i18n key still fails the deploy. That gate is deliberate: it is
      # what stops a malformed article from reaching the live site.
      # SITE_ORIGIN is a repo *variable* (not a secret — it is a public URL). It
      # sets `site` in astro.config.mjs, which drives canonical, hreflang, og:image
      # and the sitemap. Leave it unset and the config default applies. This is the
      # one value to change at the vidapiena.com cutover.
      # PUBLIC_TURNSTILE_SITE_KEY must be here, not just in the Cloudflare
      # dashboard. It is read as `import.meta.env.PUBLIC_TURNSTILE_SITE_KEY`,
      # which Vite inlines at BUILD time — a repo variable that never reaches
      # this step compiles to `undefined`, the widget block is folded away, and
      # the form ships with no Turnstile field. Meanwhile TURNSTILE_SECRET_KEY is
      # a runtime Worker secret that takes effect immediately, so setting the
      # secret alone makes every login fail 'robot' with nothing to click.
      # See docs/HOSTING.md for the activation order (variable first, then deploy,
      # then the secret).
      # ⚠️ The Cloudflare credentials belong on the BUILD step too, not only on the
      # deploy below, and it is not obvious why.
      #
      # `ai` in wrangler.jsonc is a **remote-only** binding — there is no local
      # emulation of Workers AI. So when the adapter prerenders the static pages it
      # spins up a Vite dev/preview server, sees a remote binding, and opens a
      # remote proxy session against the real account. With no token in the
      # environment that session cannot start and the BUILD dies before a single
      # page is rendered:
      #
      #   Failed to start the remote proxy session. Error reloading remote server:
      #   In a non-interactive environment, it's necessary to set a
      #   CLOUDFLARE_API_TOKEN environment variable for wrangler to work.
      #
      # It passes locally regardless, because `wrangler login` leaves an OAuth
      # token in the keyring and the session picks that up — so this is invisible
      # until CI runs it. Same shape as the other traps in this project: the thing
      # that only fails where nobody is watching.
      - name: Build
        run: npm run build
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
