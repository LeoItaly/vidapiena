name: Deploy to Cloudflare Workers

# The site moved off GitHub Pages because the back office at /admin needs a
# server runtime. Every public page is still prerendered; only /admin/* runs
# on demand. The triggers are unchanged from the Pages workflow: every push to
# main publishes, and the daily cron rebuilds so the Instagram tiles refresh
# after Behold's once-daily sync.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC — refreshes the Instagram tiles after Behold's once-daily sync

permissions:
  contents: read

# One deploy at a time. Unlike the Pages workflow this does NOT
# cancel-in-progress: a run started by the back office is publishing a real
# article, and cancelling it half-way would leave Francesco watching a publish
# that never lands.
concurrency:
  group: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Astro's image cache. Without this every run re-encodes all 545 AVIF/WebP/JPEG
      # derivatives from scratch — most of the build time Francesco waits through
      # after tapping Pubblica. Keyed on the photo pool plus the sharp version, since
      # either changing invalidates the encodings; falls back to the newest partial
      # cache so adding one photo reuses the other 545.
      - name: Restore Astro asset cache
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-assets-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-assets-

      # Bakes the latest Instagram posts into src/assets/ before Astro builds.
      # The script never fails the build — a down/absent feed falls back to the
      # curated strip.
      - name: Fetch Instagram feed
        run: node scripts/fetch-instagram.mjs
        env:
          BEHOLD_FEED_ID: ${{ secrets.BEHOLD_FEED_ID }}

      # `npm run build` is `astro check && astro build`, so a type error or a
      # missing i18n key still fails the deploy. That gate is deliberate: it is
      # what stops a malformed article from reaching the live site.
      # SITE_ORIGIN is a repo *variable* (not a secret — it is a public URL). It
      # sets `site` in astro.config.mjs, which drives canonical, hreflang, og:image
      # and the sitemap. Leave it unset and the config default applies. This is the
      # one value to change at the vidapiena.com cutover.
      - name: Build
        run: npm run build
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
